<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수련 기회비용 계산기</title>
<meta name="description" content="인턴·레지던트·펠로우로 늦게 시작하는 동안 놓치는 돈과, 몇 살까지 매달 얼마 더 모아야 따라잡는지 계산합니다.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:title" content="수련 기회비용 계산기">
<meta property="og:description" content="수련으로 늦게 시작하는 동안 놓치는 돈과 몇 살에 따라잡는지 계산해 드려요.">
<meta property="og:image" content="https://suryeon-calc.github.io/og.png">
<meta property="og:url" content="https://suryeon-calc.github.io/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f4f5f2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 방문자 수 (Umami, 쿠키 없음) -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="5113d9e8-158c-41ec-a16c-ea4a9c012a05"></script>
<style>
/* 폰 한 줄 세로 배치. 화면당 질문 하나, 진한 버튼은 화면에 하나 */
:root{
  --bg:#f4f5f2; --paper:#ffffff; --ink:#17201c; --mute:#68726d; --faint:#9aa39e; --line:#dfe3df;
  --sp:#1d6a51; --gp:#8b938f; --gain:#1d6a51; --loss:#b23e37; --sel:#eef3f0;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513; --paper:#181d1a; --ink:#e6ebe8; --mute:#9aa49f; --faint:#6c7570; --line:#29302c;
  --sp:#4cb48c; --gp:#7d8782; --gain:#4cb48c; --loss:#e0716a; --sel:#1d2622; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --paper:#181d1a; --ink:#e6ebe8; --mute:#9aa49f; --faint:#6c7570; --line:#29302c;
  --sp:#4cb48c; --gp:#7d8782; --gain:#4cb48c; --loss:#e0716a; --sel:#1d2622; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sp);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;height:52px;padding-top:env(safe-area-inset-top,0px)}
.back{display:flex;align-items:center;gap:2px;color:var(--mute);font-size:15px;height:44px}
.back svg{width:20px;height:20px}
.count{color:var(--faint);font-size:13px}
.brand{font-size:15px;font-weight:700}
.bar{height:2px;background:var(--line);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s ease}

/* 질문 */
.q{padding:36px 0 24px}
.q h1{font-size:24px;line-height:1.35;font-weight:700;margin:0 0 8px;text-wrap:balance;letter-spacing:-0.02em}
.q p{margin:0;color:var(--mute);font-size:15px}
.list{border-top:1px solid var(--line)}
.opt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.opt .l{display:flex;flex-direction:column;flex:1;min-width:0}
.opt .t{font-size:17px;font-weight:500}
.opt .s{font-size:13px;color:var(--mute)}
.opt .r{color:var(--mute);font-size:15px}
.opt .ck{width:22px;height:22px;flex:none;color:var(--ink);opacity:0}
.opt[aria-checked="true"] .t{font-weight:700}
.opt[aria-checked="true"] .ck{opacity:1}
.opt[aria-checked="true"]{background:linear-gradient(90deg,transparent,var(--sel) 30%,transparent)}

.stepper{display:flex;align-items:center;justify-content:center;gap:28px;padding:28px 0}
.stepper button{width:56px;height:56px;border:1px solid var(--line);border-radius:50%;font-size:24px;color:var(--mute)}
.stepper .v{font-size:56px;font-weight:700;min-width:120px;text-align:center;letter-spacing:-0.03em}
.stepper .v input{width:2.2ch;font:inherit;font-weight:700;text-align:center;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:0}
.stepper .v small{font-size:20px;font-weight:600;margin-left:2px}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.field label{font-size:15px;color:var(--mute)}
.field .in{display:flex;align-items:baseline;gap:4px}
.field input{width:120px;text-align:right;font:inherit;font-size:20px;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 0;font-variant-numeric:tabular-nums}
.field .u{color:var(--mute);font-size:15px}
.field .hint{display:block;font-size:12px;color:var(--faint)}
.src{font-size:12px;color:var(--faint);margin-top:12px}

.slider{padding:20px 0 8px}
.slider .v{font-size:56px;font-weight:700;letter-spacing:-0.03em}
.slider input{width:100%;accent-color:var(--ink);margin:16px 0}
.pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pair div{padding:14px 0}
.pair div+div{padding-left:16px;border-left:1px solid var(--line)}
.pair .k{font-size:13px;color:var(--mute)}
.pair .x{font-size:20px;font-weight:700}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:48px;font-size:16px;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg);font-weight:700}

/* 하단 고정 */
.foot{position:sticky;bottom:0;margin-top:auto;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 24%)}
.primary{width:100%;height:56px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:700}
.skip{display:block;width:100%;text-align:center;color:var(--mute);font-size:14px;height:40px;margin-top:4px}

/* 과 고르기: 3열 칸 */
.depts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.depts button{position:relative;min-height:56px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.3;word-break:keep-all;text-align:center}
.depts button span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.depts button[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--sel);font-weight:700}

/* 결과 */
.res{padding:28px 0 8px}
.lab{font-size:14px;color:var(--mute);font-weight:500}
.big{font-size:48px;line-height:1.1;font-weight:800;letter-spacing:-0.035em;margin:6px 0 10px}
.big small{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-left:2px}
.say{margin:0;font-size:15px;color:var(--ink)}
.say .m{color:var(--mute)}
.say b{font-weight:700}
.hr{height:1px;background:var(--line);margin:28px 0}
.verdict{margin-top:14px;padding:12px 14px;border-left:3px solid var(--gain);background:var(--sel);font-size:15px}
.verdict.bad{border-left-color:var(--loss)}
.chart{margin:8px 0 0}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.tune{display:grid;gap:14px;padding:4px 0}
.tune .row{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:12px}
.tune .row span{font-size:14px;color:var(--mute)}
.tune .rv{display:flex;align-items:center;gap:10px}
.tune input{flex:1;accent-color:var(--ink)}
.tune .seg button{height:40px;font-size:15px}
details{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;height:52px;font-size:15px;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary svg{width:18px;height:18px;color:var(--mute);transition:transform .2s}
details[open] summary svg{transform:rotate(180deg)}
.tbl{overflow-x:auto;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:12px}
td:first-child,th:first-child{text-align:left}
td .st{display:block;font-size:11px;color:var(--faint)}
tr.x td{font-weight:700}
.pos{color:var(--gain)}.neg{color:var(--loss)}
.note{font-size:12px;color:var(--faint);line-height:1.6;margin:16px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ---------- 기본값 데이터 ----------
// 전문의 연평균 소득(만원): 보건의료인력 실태조사 2020년 기준 (나영균·정은영, 병원경영학회지 29(1) 표1)
const DEPTS=[
 ["안과",38918,4],["정형외과",37554,4],["신경외과",32636,4],["피부과",28474,4],["재활의학과",27907,4],
 ["마취통증의학과",24397,4],["영상의학과",24105,4],["산부인과",23735,4],["응급의학과",23415,4],["비뇨의학과",23156,4],
 ["내과",22855,3],["흉부외과",22576,4],["외과",22369,3],["성형외과",22258,4],["정신건강의학과",21855,4],
 ["신경과",21082,4],["직업환경의학과",19782,4],["방사선종양학과",17977,4],["이비인후과",17588,4],["가정의학과",17287,3],
 ["병리과",16041,4],["핵의학과",15667,4],["진단검사의학과",14695,4],["예방의학과",13896,4],["소아청소년과",13474,3]];
const GP_INCOME=18847; // 일반의 봉직 평균 연봉(만원), 메디게이트 연봉인덱스 2021

// ---------- 계산 ----------
// 기본 월 저축 = (연소득 − 종합소득세·지방세 단순 적용) × 50% ÷ 12. 사용자에겐 결과 금액만 보여줌
function tax(x){const B=[[1400,.06],[5000,.15],[8800,.24],[15000,.35],[30000,.38],[50000,.40],[100000,.42],[1e12,.45]];
  let t=0,lo=0;for(const[hi,r]of B){if(x>lo)t+=(Math.min(x,hi)-lo)*r;lo=hi}return t*1.1}
const SAVE=0.5;
const defMonthly=inc=>Math.round((inc-tax(inc))*SAVE/12);
const deptOf=n=>DEPTS.find(x=>x[0]===n);

// ---------- 상태 ----------
const S={age:29,mil:0,intern:1,dept:"안과",resid:4,fellow:1,mGP:defMonthly(GP_INCOME),mSP:defMonthly(38918),r:5};
let step=0, view="q";
const MAXAGE=90;

function model(){
  const months=Math.max(0,Math.round((MAXAGE-S.age)*12));
  const rm=Math.pow(1+S.r/100,1/12)-1;
  const gs=S.mil*12, trainY=S.intern+S.resid+S.fellow, ss=(trainY+S.mil)*12;
  const gp=[0],sp=[0]; let g=0,p=0;
  for(let m=0;m<months;m++){ g=g*(1+rm)+(m>=gs?S.mGP:0); p=p*(1+rm)+(m>=ss?S.mSP:0); gp.push(g);sp.push(p); }
  let cross=null;
  for(let m=ss+1;m<=months;m++){ if(sp[m]>gp[m]){const a=gp[m-1]-sp[m-1],b=gp[m]-sp[m];const f=a/(a-b);
      cross={m:m-1+f,age:S.age+(m-1+f)/12,val:gp[m-1]+(gp[m]-gp[m-1])*f};break;} }
  const show=cross?Math.min(months,Math.max(Math.ceil(cross.m/12)+8,25)*12):Math.min(months,Math.max(65-S.age,25)*12);
  return {months:show,gs,ss,trainY,gp,sp,cross,cost:gp[Math.min(ss,months)],catchY:cross?(cross.m-ss)/12:null};
}
const eok=v=>{const e=v/1e4;return Math.abs(e)>=10?e.toFixed(0):e.toFixed(1)};
const man=v=>Math.round(v).toLocaleString("ko-KR");

// ---------- 질문 ----------
const ic={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 ck:'<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'};
const opts=(key,list)=>`<div class="list" role="radiogroup">${list.map(([v,t,s])=>`<button class="opt" role="radio" aria-checked="${S[key]==v}" data-k="${key}" data-v="${v}"><span class="l"><span class="t">${t}</span>${s?`<span class="s">${s}</span>`:""}</span>${ic.ck}</button>`).join("")}</div>`;
const segs=(key,list)=>`<div class="seg" role="radiogroup">${list.map(([v,t])=>`<button role="radio" aria-checked="${S[key]==v}" data-k="${key}" data-v="${v}">${t}</button>`).join("")}</div>`;

const STEPS=[
 {q:"지금 몇 살인가요?",h:"한국 나이로 적어주세요.",b:()=>`<div class="stepper"><button data-age="-1" aria-label="한 살 빼기">−</button><div class="v num"><input id="age" class="num" inputmode="numeric" value="${S.age}" aria-label="나이"><small>살</small></div><button data-age="1" aria-label="한 살 더하기">+</button></div>`},
 {q:"군 복무가 남아 있나요?",h:"미필이면 수련을 받든 안 받든 3년이 빠져요. 순서만 달라요.",b:()=>opts("mil",[[3,"남아 있어요","공보의·군의관 3년"],[0,"해결했어요","면제, 여성, 복무 완료"]])},
 {q:"인턴 1년이 남아 있나요?",h:"수련을 안 받으면 인턴도 안 하니 이 1년도 아낄 수 있어요.",b:()=>opts("intern",[[1,"남아 있어요","수련 경로에 1년 추가"],[0,"이미 마쳤어요",""]])},
 {q:"어느 과를 생각하나요?",h:"레지던트 기간과 평균 소득이 자동으로 들어가요.",b:()=>`<div class="depts" role="radiogroup">${DEPTS.map(([n,,y])=>`<button role="radio" aria-checked="${S.dept===n}" data-k="dept" data-v="${n}">${n}${y===3?`<span>3년</span>`:""}</button>`).join("")}</div>`},
 {q:"펠로우는 몇 년 할 건가요?",h:"전문의 취득 뒤 임상강사 기간이에요.",b:()=>opts("fellow",[[0,"안 해요",""],[1,"1년",""],[2,"2년",""]])},
 {q:"한 달에 얼마씩 모을까요?",h:"평균 소득에서 세금을 빼고 절반을 모은다고 보고 채워 뒀어요. 생각해 둔 금액이 있으면 바꿔주세요. 수련받는 동안 저축액은 0으로 봐요.",b:()=>`
   <div class="field"><label>수련 안 받으면 (GP)<span class="hint">세후 월 저축</span></label><span class="in"><input class="num" id="mGP" inputmode="numeric" value="${S.mGP}"><span class="u">만원</span></span></div>
   <div class="field"><label>전문의가 되면<span class="hint">${S.dept} · 세후 월 저축</span></label><span class="in"><input class="num" id="mSP" inputmode="numeric" value="${S.mSP}"><span class="u">만원</span></span></div>
   <div class="src">평균 소득 출처: 전문의는 보건의료인력 실태조사(2020년 기준), 일반의는 메디게이트 구인공고 평균(2021년). </div>`},
 {q:"모은 돈은 연 몇 %로 굴러갈까요?",h:"예상 수익률이에요. 잘 모르겠으면 5%로 두세요.",b:()=>segs("r",[[5,"5%"],[7,"7%"],[9,"9%"]])}
];

// ---------- 화면 ----------
function render(){
  const a=document.getElementById("app");
  if(view==="r"){a.innerHTML=result();bindResult();return;}
  const st=STEPS[step], n=STEPS.length;
  a.innerHTML=`<div class="top">${step?`<button class="back" id="prev">${ic.back}이전</button>`:`<span class="brand">수련 기회비용 계산기</span>`}<span class="count num">${step+1} / ${n}</span></div>
    <div class="bar"><i style="width:${(step+1)/n*100}%"></i></div>
    <div class="q"><h1>${st.q}</h1><p>${st.h}</p></div>${st.b()}
    <div class="foot"><button class="primary" id="next">${step===n-1?"결과 보기":"다음"}</button>${step<n-1?`<button class="skip" id="skip">나머지는 기본값으로 결과 보기</button>`:""}</div>`;
  bindQ();
}
const clampAge=v=>Math.min(60,Math.max(20,Math.round(v)||29));
function bindQ(){
  const a=document.getElementById("app");
  a.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;let v=b.dataset.v;S[k]=isNaN(+v)?v:+v;
    if(k==="dept"){const d=deptOf(v);S.resid=d[2];S.mSP=defMonthly(d[1]);}
    render();});
  a.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{S.age=clampAge(S.age+ +b.dataset.age);render();});
  const ag=document.getElementById("age");
  if(ag){ag.oninput=()=>{const v=+ag.value.replace(/[^\d]/g,"");if(v)S.age=v;};ag.onblur=()=>{S.age=clampAge(S.age);ag.value=S.age;};}
  ["mGP","mSP"].forEach(id=>{const e=document.getElementById(id);if(e)e.oninput=()=>{S[id]=+e.value.replace(/[^\d]/g,"")||0;}});
  const go=()=>{S.age=clampAge(S.age);};
  document.getElementById("next").onclick=()=>{go();if(step<STEPS.length-1){step++;render();}else{view="r";render();scrollTo(0,0);}};
  const sk=document.getElementById("skip");if(sk)sk.onclick=()=>{go();view="r";render();scrollTo(0,0);};
  const pv=document.getElementById("prev");if(pv)pv.onclick=()=>{go();if(step){step--;render();}};
}

function trainLabel(){const p=[];if(S.intern)p.push("인턴 "+S.intern);p.push("레지던트 "+S.resid);if(S.fellow)p.push("펠로우 "+S.fellow);return p.join(" · ");}

function result(){
  const M=model(), c=M.cross, yrs=c?Math.round(M.catchY):null;
  const head=c?`${eok(M.cost)}<small>억</small> + ${yrs}<small>년</small>`:`${eok(M.cost)}<small>억</small>`;
  const say=c?`수련 ${M.trainY}년 동안 GP가 <b class="num">${eok(M.cost)}억</b>을 먼저 모으고, 전문의가 된 뒤에도 따라잡기까지 <b class="num">${yrs}년</b>이 더 걸려요.`
             :`수련 ${M.trainY}년 동안 GP가 <b class="num">${eok(M.cost)}억</b>을 먼저 모으고, 그 차이를 끝내 따라잡지 못해요.`;
  const why=S.mSP<=S.mGP?`전문의 월 저축(${man(S.mSP)}만)이 GP(${man(S.mGP)}만)보다 많지 않아서 차이가 줄어들지 않아요.`:`${MAXAGE}살까지 계산해도 따라잡지 못해요.`;
  return `<div class="top"><span class="brand">수련 기회비용 계산기</span><button class="back" id="restart">처음부터</button></div>
  <div class="res">
    <div class="lab">수련의 기회비용</div>
    <div class="big num">${head}</div>
    <p class="say">${say} <span class="m">(${trainLabel()}${S.mil?" · 군 복무는 양쪽 다 3년":""})</span></p>
    <div class="hr"></div>
    <div class="lab">전문의가 GP를 앞서는 나이</div>
    <div class="big num">${c?c.age.toFixed(1)+"<small>살</small>":"없음"}</div>
    ${c?`<p class="say">이때부터 전문의가 모은 돈이 GP보다 많아지고, 차이는 계속 벌어져요.</p>`:`<div class="verdict bad">${why}</div>`}
    <p class="say m" style="margin-top:12px;font-size:14px">월 저축 · GP <b class="num">${man(S.mGP)}만</b> / 전문의(${S.dept}) <b class="num">${man(S.mSP)}만</b> · 수익률 연 ${S.r}%<br>수련받는 동안(군 복무 포함) 저축액은 0으로 봐요.</p>
  </div>
  <div class="hr"></div>
  <div class="legend"><span><i style="background:var(--gp)"></i>GP</span><span><i style="background:var(--sp)"></i>전문의</span></div>
  <div class="chart">${chart(M)}</div>
  <div class="hr" style="margin:20px 0"></div>
  <div class="tune"><div class="row"><span>수익률</span>${segs("r",[[5,"5%"],[7,"7%"],[9,"9%"]])}</div></div>
  <div class="hr" style="margin:20px 0 0"></div>
  <details id="tbl"><summary>나이별로 보기${ic.down}</summary><div class="tbl">${table(M)}</div></details>
  <p class="note">계산 방법: 기본 월 저축은 평균 연소득에서 종합소득세를 단순 적용해 뺀 뒤 절반을 모은다고 본 값이에요. 수련·군 복무 중 저축 0원, 매달 말 적립, 연 수익률을 월 복리로 환산했어요. 물가는 반영하지 않은 명목 금액이고, 평균값이라 실제와 다를 수 있어요. 투자 조언이 아닙니다.</p>
  <div class="foot"><button class="primary" id="share">결과 링크 복사</button></div>`;
}

function chart(M){
  const W=400,H=230,L=42,R=44,T=14,B=26, n=M.months, endAge=S.age+n/12;
  let mx=0;for(let m=0;m<=n;m++)mx=Math.max(mx,M.gp[m],M.sp[m]);mx/=1e4;
  const raw=mx/4,pw=Math.pow(10,Math.floor(Math.log10(raw||1))),q=raw/pw,st=(q<1.5?1:q<3?2:q<7?5:10)*pw,top=Math.ceil(mx/st)*st||1;
  const x=m=>L+(W-L-R)*m/n, y=v=>T+(H-T-B)*(1-v/1e4/top);
  let s="";
  for(let v=0;v<=top+1e-9;v+=st){s+=`<line x1="${L}" x2="${W-R}" y1="${y(v*1e4)}" y2="${y(v*1e4)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v*1e4)+4}" text-anchor="end" font-size="10" fill="var(--faint)">${+v.toFixed(1)}${v+st>top+1e-9?"억":""}</text>`;}
  const tk=(endAge-S.age)>30?10:5;
  for(let a=Math.ceil(S.age/tk)*tk;a<=endAge;a+=tk){s+=`<text x="${x((a-S.age)*12)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)">${a}살</text>`;}
  const path=a=>{let d="";for(let m=0;m<=n;m+=Math.max(1,Math.floor(n/200)))d+=(d?"L":"M")+x(m).toFixed(1)+" "+y(a[m]).toFixed(1);return d+"L"+x(n).toFixed(1)+" "+y(a[n]).toFixed(1)};
  s+=`<path d="${path(M.gp)}" fill="none" stroke="var(--gp)" stroke-width="2"/><path d="${path(M.sp)}" fill="none" stroke="var(--sp)" stroke-width="2.4"/>`;
  if(M.cross){const cx=x(M.cross.m),cy=y(M.cross.val);
    s+=`<line x1="${cx}" x2="${cx}" y1="${cy}" y2="${H-B}" stroke="var(--ink)" stroke-dasharray="2 3" stroke-width="1"/><circle cx="${cx}" cy="${cy}" r="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>
    <text x="${cx-6}" y="${cy-10}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${M.cross.age.toFixed(1)}살</text>`;}
  let ya=y(M.gp[n]),yb=y(M.sp[n]);if(Math.abs(ya-yb)<13){if(ya<yb){ya-=6;yb+=6}else{ya+=6;yb-=6}}
  s+=`<text x="${W-R+5}" y="${ya+4}" font-size="11" font-weight="700" fill="var(--gp)">${eok(M.gp[n])}억</text><text x="${W-R+5}" y="${yb+4}" font-size="11" font-weight="700" fill="var(--sp)">${eok(M.sp[n])}억</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="나이별 누적 자산">${s}</svg>`;
}

function stage(path,k){
  if(path==="g") return k<S.mil?"군":"GP";
  const seq=[];for(let i=0;i<S.intern;i++)seq.push("인턴");for(let i=0;i<S.resid;i++)seq.push("레지던트");for(let i=0;i<S.mil;i++)seq.push("군");for(let i=0;i<S.fellow;i++)seq.push("펠로우");
  return seq[k]||"전문의";
}
function table(M){
  const yrs=Math.floor(M.months/12), cy=M.cross?Math.ceil(M.cross.m/12):-1;
  let h=`<table><tr><th>나이</th><th>GP</th><th>전문의</th><th>차이</th></tr>`;
  for(let k=1;k<=yrs;k++){const m=k*12,g=M.gp[m],p=M.sp[m],d=p-g;
    h+=`<tr class="${k===cy?"x":""}"><td>${S.age+k}살</td><td>${eok(g)}억<span class="st">${stage("g",k-1)}</span></td><td>${eok(p)}억<span class="st">${stage("p",k-1)}</span></td><td class="${d>=0?"pos":"neg"}">${d>=0?"+":""}${eok(d)}억</td></tr>`;}
  return h+"</table>";
}
function bindResult(){
  document.querySelectorAll("#app [data-k]").forEach(b=>b.onclick=()=>{S[b.dataset.k]=+b.dataset.v;keep();});
  document.getElementById("restart").onclick=()=>{view="q";step=0;render();scrollTo(0,0);};
  document.getElementById("share").onclick=async e=>{const u=location.href.split("#")[0]+"#"+enc();
    try{await navigator.clipboard.writeText(u);e.target.textContent="복사했어요";}catch{e.target.textContent="복사하지 못했어요";}
    setTimeout(()=>e.target.textContent="결과 링크 복사",1600);};
}
function keep(){const y=scrollY,open=document.getElementById("tbl").open;render();document.getElementById("tbl").open=open;scrollTo(0,y);}

// ---------- 링크 공유 ----------
const KEYS=["age","mil","intern","dept","fellow","mGP","mSP","r"];
const enc=()=>KEYS.map(k=>k+"="+encodeURIComponent(S[k])).join("&");
function dec(h){const p=new URLSearchParams(h.replace(/^#/,""));
  KEYS.forEach(k=>{if(p.has(k)){const v=p.get(k);S[k]=k==="dept"?v:+v;}});
  const d=deptOf(S.dept); if(d){S.resid=d[2]; if(!p.has("mSP"))S.mSP=defMonthly(d[1]);} else {S.dept="안과";}
  if(p.has("s")){const s=p.get("s");if(s[0]==="r")view="r";else step=+s;}
  if(p.has("age")&&!p.has("s"))view="r";
  return p.get("s");}
const s0=dec(location.hash); render();
if(s0==="rb"){const t=document.getElementById("tbl");t.open=true;document.querySelector(".chart").scrollIntoView();}
</script>
</body>
</html>
